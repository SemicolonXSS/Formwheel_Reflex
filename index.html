<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fc">
<title>FormWheel Reflex</title>
<link rel="stylesheet" href="./assets/styles.css?v=ec8718a1441e">
<link rel="stylesheet" href="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.css">
<script defer src="https://semicolonxss.github.io/Formwheel/shared/formwheel-ui.js"></script>
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg">
<meta property="og:title" content="Reflex · Formwheel">
<meta property="og:description" content="혼자 반응 속도를 측정하고 이 기기의 최고 기록에 도전하는 게임.">
<meta property="og:image" content="https://semicolonxss.github.io/Formwheel_Reflex/assets/thumbnail.svg">
</head>
<body>
<main class="app">
  <header class="header">
    <button class="logo" id="logo">FormWheel <span>Reflex</span></button>
    <button class="home" id="homeBtn">Games</button>
  </header>

  <section class="card intro" id="intro">
    <div class="badge">FORMWHEEL GAME</div>
    <h1>Reflex</h1>
    <p class="sub">화면이 바뀌는 순간을 잡아라.<br>빠를수록 높은 점수를 얻습니다.</p>
    <div class="rules">
      <div class="rule"><b>⚡ GO</b><span>랜덤 순간에 시작</span></div>
      <div class="rule"><b>🎯 CLICK</b><span>최대한 빠르게</span></div>
      <div class="rule"><b>🏆 RECORD</b><span>최고 기록에 도전</span></div>
    </div>
    <button class="primary" id="startBtn">게임 시작</button>
  </section>

  <section class="card game" id="game">
    <div class="game-top">
      <span id="roundText">ROUND 1</span>
      <span id="bestText">BEST —</span>
    </div>
    <div class="stage wait" id="stage">
      <div>
        <div class="big" id="stageTitle">READY</div>
        <div class="small" id="stageSub">준비되면 화면을 눌러주세요</div>
      </div>
    </div>
    <div class="note">너무 빨리 누르면 실패합니다.</div>
  </section>

  <section class="card result" id="result">
    <div class="label">YOUR REACTION TIME</div>
    <div><span class="time" id="finalTime">0</span> <span class="unit">ms</span></div>
    <div class="rank" id="rank">—</div>
    <div class="stats">
      <div class="stat"><b id="bestStat">—</b><span>BEST</span></div>
      <div class="stat"><b id="avgStat">—</b><span>AVERAGE</span></div>
      <div class="stat"><b id="roundStat">—</b><span>ROUNDS</span></div>
    </div>
    <div class="actions">
      <button class="secondary" id="againBtn">다시 하기</button>
      <button class="primary" id="gamesBtn">Games로</button>
    </div>
  </section>
<section class="card" style="padding:24px;margin-top:20px"><h2>⚔️ Battle</h2><p id="battleNetwork" role="status">연결 확인 중</p><label>닉네임 <input id="battleName" maxlength="12" autocomplete="nickname"></label><label>방 코드 <input id="battleCode" maxlength="4" inputmode="numeric"></label><div class="actions" style="margin-top:12px"><button id="battleCreate" class="secondary">방 만들기</button><button id="battleJoin" class="secondary">참가</button><button id="battleStart" class="primary" hidden>5라운드 시작 / 재시작</button><button id="battleLeave" class="secondary" hidden>나가기</button></div><p id="battleMessage" role="status"></p><button id="battleTap" class="primary" style="height:190px;font-size:36px;touch-action:manipulation" hidden>READY</button><ol id="battlePlayers"></ol></section>
</main>

<script src="./assets/app.js?v=b65c1ff55472"></script>
<script type="module" src="./modules/battle.js?v=642832e94af3"></script>
</body>
</html>
